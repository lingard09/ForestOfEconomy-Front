<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경제의 숲 - 알림 시간 선택</title>
  <link rel="stylesheet" href="assets/main.css">
  <link rel="stylesheet" href="assets/pages.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-page-wrapper notitime-page">
    <div class="app-content-container" style="padding: 0; min-height: 844px; overflow: hidden; border-radius: 20px;">
      <!-- 상단 질문 영역 (알림 종 아이콘 + 텍스트) -->
      <div class="header-section">
        <img class="bell-icon" src="assets/bell.png" alt="알림 종" />
        <div class="header-title global-font-noto">언제 알람을 드릴까요?</div>
      </div>

      <!-- 알림 시간대 목록 영역 -->
      <div class="time-options-list">
        <div class="option-item" data-value="morning" style="cursor: pointer;">
          <div class="circle-checkbox"></div>
          <span class="option-label global-font-noto">아침 (8 AM)</span>
        </div>
        <div class="option-item" data-value="lunch" style="cursor: pointer;">
          <div class="circle-checkbox"></div>
          <span class="option-label global-font-noto">점심 (1 PM)</span>
        </div>
        <div class="option-item" data-value="evening" style="cursor: pointer;">
          <div class="circle-checkbox"></div>
          <span class="option-label global-font-noto">저녁 (8 PM)</span>
        </div>
        <div class="option-item" data-value="night" style="cursor: pointer;">
          <div class="circle-checkbox"></div>
          <span class="option-label global-font-noto">취침 전 (11 PM)</span>
        </div>
      </div>

      <!-- 하단 다음 버튼 -->
      <div class="button-wrapper">
        <button class="submit-button global-font-noto btn-submit" disabled style="cursor: pointer;">
          다음
        </button>
      </div>
    </div>
  </div>

  <script>
    const listItems = document.querySelectorAll('.option-item');
    const submitBtn = document.querySelector('.btn-submit');
    let selectedTime = null;

    listItems.forEach(item => {
      item.addEventListener('click', () => {
        selectedTime = item.dataset.value;

        // UI 초기화
        listItems.forEach(el => {
          el.classList.remove('is-active');
          const checkbox = el.querySelector('.circle-checkbox');
          if (checkbox) checkbox.innerHTML = '';
        });

        // 활성화
        item.classList.add('is-active');
        const checkbox = item.querySelector('.circle-checkbox');
        if (checkbox) {
          checkbox.innerHTML = `
            <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="#0a6e3c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12" />
            </svg>
          `;
        }

        submitBtn.disabled = !selectedTime;
      });
    });

    submitBtn.addEventListener('click', () => {
      if (selectedTime) {
        localStorage.setItem('noti-time', selectedTime);
        window.location.href = 'noticonfirm.html';
      }
    });
  </script>
</body>
</html>
