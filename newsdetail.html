<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>경제의 숲 - 뉴스 상세</title>
    <link rel="icon" type="image/png" href="assets/acorn.png" />
    <link rel="stylesheet" href="assets/main.css" />
    <link rel="stylesheet" href="assets/pages.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Yde+street:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 컨테이너 패딩 제거 */
      .newsdetail-page .app-content-container {
        padding: 0 !important;
      }

      .newsdetail-page .div {
        width: 100%;
        height: 100%;
        background-color: #fff;
        display: flex;
        flex-direction: column;
        text-align: left;
        font-size: 14px;
        color: #000;
        font-family: "Noto Sans KR", sans-serif;
        padding: 0 32px;
        box-sizing: border-box;
        position: relative;
      }

      /* 뒤로가기 화살표 */
      .newsdetail-page .child {
        width: 31.9px;
        height: 14.6px;
        object-fit: contain;
        opacity: 0.3;
        cursor: pointer;
        align-self: flex-start;
        margin-top: 40px;
      }

      /* 뉴스 제목 */
      .newsdetail-page .div2 {
        font-size: 20px;
        font-weight: 700;
        width: 100%;
        margin-top: 30px;
        line-height: 1.4;
      }

      /* 날짜 */
      .newsdetail-page .date-row {
        display: flex;
        align-items: center;
        width: 100%;
        margin-top: 8px;
        font-size: 12px;
        color: #999;
      }

      /* 뉴스 이미지 */
      .newsdetail-page .icon {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 8px;
        margin-top: 20px;
      }

      /* 뉴스 본문 */
      .newsdetail-page #newsContent {
        font-size: 15px;
        width: 100%;
        margin-top: 20px;
        line-height: 1.7;
        color: #333;
        flex: 1;
        overflow-y: auto;
        margin-bottom: 110px; /* 네비바 공간 확보 */
      }

      /* 하단 네비게이션 바 외부 컨테이너 */
      .newsdetail-page .div27 {
        position: absolute;
        bottom: 40px;
        left: calc(50% - 162.5px);
        width: 325px;
        height: 50px;
        border-radius: 40px;
        background-color: #131313;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div class="app-page-wrapper newsdetail-page">
      <div class="app-content-container">
        <div class="div">
          <img class="child btn-back" src="assets/arrow_back.png" alt="뒤로가기" />

          <div class="div2" id="newsTitle">로딩 중...</div>

          <div class="date-row">
            <div id="newsDate">6시간 전</div>
          </div>

          <img class="icon" id="newsImage" alt="뉴스 이미지" src="" />

          <div class="div4" id="newsContent">
            로딩 중...
          </div>

          <!-- 하단 공통 네비게이션 바 컨테이너 -->
        </div>
        <div class="div27"></div>
      </div>
    </div>

    <!-- 네비바 스크립트 로드 및 실행 -->
    <script src="assets/navbar.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // 뉴스 탭 활성화
        renderNavbar("news");

        const newsData = {
          "1": {
            title: "엔저 현상에 일본 여행객 사상 최대… 엔화 환전 붐",
            date: "3시간 전",
            image: "assets/news_yen.png",
            content: "원·엔 환율이 100엔당 800원대 중반까지 떨어지는 엔저(엔화 약세) 현상이 지속되면서, 국내 은행권의 엔화 환전액이 사상 최고치를 경신하고 있습니다. 특히 여름 휴가철과 연휴 시즌을 앞두고 일본 주요 관광지로 향하는 여행객이 폭발적으로 늘어나면서 엔화 환전 수요 및 현지 카드 결제액 또한 가파르게 상승하고 있습니다. 전문가들은 일본 중앙은행의 기준금리 정책 방향에 따라 당분간 이러한 엔저 기조가 유지될 가능성이 높다고 분석하고 있습니다."
          },
          "2": {
            title: "비트코인, 역사적 신고가 돌파… 10만 달러 돌파할까",
            date: "7시간 전",
            image: "assets/news_bitcoin.png",
            content: "가상자산 시장의 대장주인 비트코인이 글로벌 인플레이션 헤지 수요와 미정부의 친화적인 가상자산 규제 개혁 기대감에 힙입어 연일 사상 최고가를 새로 쓰고 있습니다. 전문가들은 최근 비트코인 현물 ETF를 통한 대규모 기관 자금 유입이 상승 랠리를 견인하는 가장 강력한 요인이라고 보고 있으며, 현재 속도로 상승 흐름이 이어진다면 조만간 꿈의 10만 달러 고지를 돌파할 수 있을 것이라는 긍정적인 전망을 내놓고 있습니다."
          },
          "3": {
            title: "K-푸드 전성시대… 라면·냉동김밥 수출액 역대 최고 경신",
            date: "1일 전",
            image: "assets/news_kfood.png",
            content: "한국 라면과 냉동김밥 등 K-푸드(Korean Food) 제품들이 SNS 챌린지와 웰빙 열풍을 타고 북미, 유럽, 동남아를 아우르는 전 세계 시장에서 선풍적인 인기를 끌고 있습니다. 특히 한류 콘텐츠 속 푸드 문화 노출이 마케팅 기폭제로 작용하면서 식음료 가공식품의 올해 상반기 누적 수출액이 역사상 최대치를 넘어섰습니다. 기업들은 글로벌 시장 맞춤형 맛 다변화와 유통 판로 확대를 가속화하고 있습니다."
          }
        };

        // URL 파라미터에서 id 추출
        const params = new URLSearchParams(window.location.search);
        const newsId = params.get("id") || "1";
        const currentNews = newsData[newsId] || newsData["1"];

        // 상세 내용 렌더링
        document.getElementById("newsTitle").textContent = currentNews.title;
        document.getElementById("newsDate").textContent = currentNews.date;
        document.getElementById("newsImage").setAttribute("src", currentNews.image);
        document.getElementById("newsContent").textContent = currentNews.content;

        // 뒤로가기 버튼 클릭 이벤트
        const backBtn = document.querySelector(".btn-back");
        if (backBtn) {
          backBtn.addEventListener("click", () => {
            window.location.href = "newslist.html";
          });
        }
      });
    </script>
  </body>
</html>
