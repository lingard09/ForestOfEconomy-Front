<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경제의 숲 - 시작하기</title>
  <link rel="icon" type="image/png" href='assets/acorn.png">
  <link rel="stylesheet" href='assets/main.css">
  <link rel="stylesheet" href='assets/pages.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-page-wrapper home-page-container">
    <div class="app-content-container">
      <div class="home-page">
        <div class="app-info">
          <h1 class="app-title">경제의 숲</h1>
          <p class="app-subtitle">매일매일 경제 지식 한토막</p>
        </div>

        <div class="mascot-wrapper">
          <img
            class="mascot-image"
            src='assets/home_mascot.png"
            alt="경제의 숲 마스코트"
          />
        </div>

        <div class="social-login-section">
          <hr class="divider" />
          <div class="social-icons">
            <img
              class="social-icon"
              src="https://api.builder.io/api/v1/image/assets/TEMP/aedc79130e07ecc687d42d6aecb85d8fb7f3c074?width=81"
              alt="구글 로그인"
              style="cursor: pointer;"
            />
            <img
              class="social-icon naver-icon"
              src="https://api.builder.io/api/v1/image/assets/TEMP/6db46ead6f02484dfd98268044c3c290f1cc93cf?width=81"
              alt="네이버 로그인"
              style="cursor: pointer;"
            />
            <img
              class="social-icon kakao-icon"
              src="https://api.builder.io/api/v1/image/assets/TEMP/1aa3797f7c58f7c34b3e4138a4e2bea2aec57fe9?width=81"
              alt="카카오 로그인"
              style="cursor: pointer;"
            />
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 소셜 아이콘 클릭 시 greeting 페이지로 이동
    document.querySelectorAll('.social-icon').forEach(icon => {
      icon.addEventListener('click', () => {
        window.location.href = 'onboarding/greeting.html';
      });
    });
  </script>
</body>
</html>
