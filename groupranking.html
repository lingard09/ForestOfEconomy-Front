<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>경제의 숲 - 그룹 랭킹</title>
    <link rel="icon" type="image/png" href="assets/acorn.png" />
    <link rel="stylesheet" href="assets/main.css?v=1.0.4" />
    <link rel="stylesheet" href="assets/pages.css?v=1.0.5" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Yde+street:wght@400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="app-page-wrapper groupranking-page">
      <div class="app-content-container">
        <div class="div">
          <!-- 뒤로가기 버튼 -->
          <img class="btn-back" src="assets/arrow_back.png" alt="뒤로가기" />

          <!-- 상단 그룹 상세 카드 -->
          <div class="frame-parent">
            <div class="container-parent">
              <div class="container">
                <div class="div2">그룹</div>
              </div>
              <div class="container2">
                <div class="paragraph2">
                  <div class="div3" id="groupNameText">그루비룸</div>
                  <div class="group-more-btn">...</div>
                </div>
                <div class="container3">
                  <div class="paragraph3">
                    <div class="yua9yfw9">
                      <span>그룹코드: </span>
                      <span class="yua9yfw92" id="groupCodeVal">YUA9YFW9</span>
                    </div>
                  </div>
                  <div class="div5" id="btnCopyCode">복사</div>
                </div>
                <div class="paragraph4">
                  <div class="div6" id="groupMemberCount">멤버: 1/6명</div>
                </div>
                <!-- 그룹 탈퇴하기 메뉴 팝업 -->
                <div class="container-child" id="leaveGroupMenuBg"></div>
                <div class="div7 btn-leave-group" id="btnLeaveGroup">그룹 탈퇴하기</div>
              </div>
            </div>
            
            <!-- 멤버 상세보기 버튼 -->
            <div class="btn-member-detail" id="btnMemberDetail">
              <div class="div7">멤버 상세보기</div>
              <div class="arrow-right-icon">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M6 15L12 9L6 3" stroke="#0A6E3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>
          </div>

          <!-- 그룹 랭킹 제목 -->
          <div class="paragraph6">
            <b class="b">그룹 랭킹</b>
          </div>

          <!-- 주별 / 월별 탭 메뉴 -->
          <div class="tab-weekly is-active" id="tabWeekly">주별</div>
          <div class="tab-monthly" id="tabMonthly">월별</div>
          <!-- 활성화 탭 표시 밑줄 선 -->
          <div class="tab-indicator" id="tabIndicator"></div>

          <!-- 랭킹 목록 리스트 -->
          <div class="container-group">
            <div class="container4">
              <div class="div10">순위</div>
              <div class="div11">그룹명</div>
              <div class="div12">출석률</div>
              <div class="div13">정답률</div>
            </div>
            <!-- 스크롤 가능한 목록 리스트 (스크립트로 동적 렌더링됨) -->
            <div class="container5" id="rankingListContainer"></div>
          </div>

          <!-- 하단 네비게이션 바 -->
          <div class="div4"></div>

          <!-- 그룹 탈퇴 확인 커스텀 모달 -->
          <div class="inner" id="leaveGroupModalBg"></div>
          <div class="group-div" id="leaveGroupModal">
            <div class="group">
              <div class="yua9yfw9">그룹을 탈퇴 하시겠습니까?</div>
              <div class="button-parent">
                <div class="button2" id="btnConfirmLeaveCancel">
                  <div class="div7">취소</div>
                </div>
                <div class="button3" id="btnConfirmLeaveOk">
                  <div class="div7">확인</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/navbar.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // 공통 네비게이션 바 컴포넌트 렌더링
        renderNavbar('group');

        // 뒤로가기 클릭 이벤트
        document.querySelector(".btn-back").addEventListener("click", () => {
          window.location.href = "group.html";
        });

        // 멤버 상세보기 이동
        document.getElementById("btnMemberDetail").addEventListener("click", () => {
          window.location.href = "groupmember.html";
        });

        // 로컬스토리지 생성된 그룹 정보 가져오기 및 뷰 매핑
        const savedGroup = localStorage.getItem("userGroupInfo");
        let activeGroupCode = "YUA9YFW9";
        let activeGroupName = "그루비룸";

        if (savedGroup) {
          try {
            const groupData = JSON.parse(savedGroup);
            if (groupData.name) {
              activeGroupName = groupData.name;
              document.getElementById("groupNameText").textContent = groupData.name;
            }
            if (groupData.code) {
              activeGroupCode = groupData.code;
              document.getElementById("groupCodeVal").textContent = groupData.code;
            }
          } catch (err) {
            console.error("그룹 데이터 불러오기 실패", err);
          }
        }

        // 복사 기능 구현
        document.getElementById("btnCopyCode").addEventListener("click", () => {
          navigator.clipboard.writeText(activeGroupCode)
            .then(() => {
              alert("그룹 코드가 클립보드에 복사되었습니다!");
            })
            .catch(err => {
              // 브라우저 권한 미승인 등 대비 fallback
              const textArea = document.createElement("textarea");
              textArea.value = activeGroupCode;
              document.body.appendChild(textArea);
              textArea.select();
              try {
                document.execCommand('copy');
                alert("그룹 코드가 클립보드에 복사되었습니다!");
              } catch (e) {
                console.error("복사 실패", e);
              }
              document.body.removeChild(textArea);
            });
        });

        // 그룹 탈퇴하기 팝업 메뉴 토글 구현
        const groupMoreBtn = document.querySelector(".group-more-btn");
        const leaveMenuBg = document.getElementById("leaveGroupMenuBg");
        const leaveBtn = document.getElementById("btnLeaveGroup");

        groupMoreBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          leaveMenuBg.classList.toggle("is-active");
          leaveBtn.classList.toggle("is-active");
        });

        // 빈 화면 클릭 시 메뉴 닫기
        document.addEventListener("click", () => {
          leaveMenuBg.classList.remove("is-active");
          leaveBtn.classList.remove("is-active");
        });

        // 그룹 탈퇴 커스텀 모달 요소 취득
        const leaveModalBg = document.getElementById("leaveGroupModalBg");
        const leaveModal = document.getElementById("leaveGroupModal");
        const confirmCancel = document.getElementById("btnConfirmLeaveCancel");
        const confirmOk = document.getElementById("btnConfirmLeaveOk");

        // 그룹 탈퇴 메뉴 클릭 시 모달 열기
        leaveBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          // 기존 팝업 메뉴 닫기
          leaveMenuBg.classList.remove("is-active");
          leaveBtn.classList.remove("is-active");
          
          // 커스텀 모달 열기
          leaveModalBg.classList.add("is-active");
          leaveModal.classList.add("is-active");
        });

        // 모달 닫기 함수
        const closeLeaveModal = () => {
          leaveModalBg.classList.remove("is-active");
          leaveModal.classList.remove("is-active");
        };

        // 취소 버튼 및 뒷배경 클릭 시 모달 닫기
        confirmCancel.addEventListener("click", closeLeaveModal);
        leaveModalBg.addEventListener("click", closeLeaveModal);

        // 확인 버튼 클릭 시 탈퇴 수행
        confirmOk.addEventListener("click", () => {
          localStorage.removeItem("userGroupInfo");
          alert("그룹에서 탈퇴되었습니다.");
          window.location.href = "group.html";
        });

        // 랭킹 가상 데이터 정의
        const rankingData = {
          weekly: [
            { rank: 1, name: "스터디왕", attendance: "85%", accuracy: "85%" },
            { rank: 2, name: activeGroupName, attendance: "81%", accuracy: "89%", isMine: true },
            { rank: 3, name: "경제사랑", attendance: "79%", accuracy: "82%" },
            { rank: 4, name: "머니헌터", attendance: "75%", accuracy: "80%" },
            { rank: 5, name: "숲속친구들", attendance: "70%", accuracy: "75%" },
            { rank: 6, name: "모으자돈", attendance: "68%", accuracy: "70%" },
            { rank: 7, name: "배움학당", attendance: "65%", accuracy: "68%" }
          ],
          monthly: [
            { rank: 1, name: "머니헌터", attendance: "92%", accuracy: "90%" },
            { rank: 2, name: "스터디왕", attendance: "90%", accuracy: "88%" },
            { rank: 3, name: activeGroupName, attendance: "88%", accuracy: "95%", isMine: true },
            { rank: 4, name: "경제사랑", attendance: "85%", accuracy: "85%" },
            { rank: 5, name: "배움학당", attendance: "80%", accuracy: "78%" },
            { rank: 6, name: "숲속친구들", attendance: "78%", accuracy: "75%" },
            { rank: 7, name: "모으자돈", attendance: "72%", accuracy: "70%" }
          ]
        };

        const listContainer = document.getElementById("rankingListContainer");

        // 랭킹 리스트 렌더링 함수
        const renderList = (type) => {
          listContainer.innerHTML = "";
          const list = rankingData[type];
          
          list.forEach(item => {
            const itemDiv = document.createElement("div");
            // 내 그룹인 경우 초록색 배경(container8), 아닌 경우 일반 흰색박스(container6)
            itemDiv.className = item.isMine ? "container8" : "container6";
            
            itemDiv.innerHTML = `
              <div class="container7">
                <div class="div14">${item.rank}</div>
                <div class="div15">${item.name}</div>
                <div class="div16">${item.attendance}</div>
                <div class="div17">${item.accuracy}</div>
              </div>
            `;
            listContainer.appendChild(itemDiv);
          });
        };

        // 초기 주별 랭킹 렌더링
        renderList('weekly');

        // 탭 토글 및 인디케이터 제어
        const tabWeekly = document.getElementById("tabWeekly");
        const tabMonthly = document.getElementById("tabMonthly");
        const indicator = document.getElementById("tabIndicator");

        tabWeekly.addEventListener("click", () => {
          tabWeekly.classList.add("is-active");
          tabMonthly.classList.remove("is-active");
          indicator.style.left = "33px"; // 주별 탭 아래 위치
          renderList('weekly');
        });

        tabMonthly.addEventListener("click", () => {
          tabMonthly.classList.add("is-active");
          tabWeekly.classList.remove("is-active");
          indicator.style.left = "95px"; // 월별 탭 아래 위치
          renderList('monthly');
        });
      });
    </script>
  </body>
</html>
