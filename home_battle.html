    <!-- 네비바 스크립트 실행 -->
    <script src="assets/navbar.js"></script>
    <script>
      // bfcache(뒤로가기 캐시) 감지: 복원된 페이지면 강제 새로고침하여 최신 상태 반영
      window.addEventListener("pageshow", (event) => {
        if (event.persisted) {
          window.location.reload();
        }
      });

      document.addEventListener("DOMContentLoaded", () => {
        // 공통 네비게이션 바 홈(home) 활성화 렌더링
        renderNavbar("home");

        // 코인 점수 로드 및 초기화
        let currentCoins = parseInt(
          localStorage.getItem("user_coins") || "400",
        );
        const coinCountEl = document.getElementById("userCoinCount");
        if (coinCountEl) {
          coinCountEl.textContent = currentCoins;
        }

        // 다람쥐 전진 및 동전 무제한 동적 생성 로직
        const xPattern = [219, 127, 66, 132, 206, 131];
        const startY = 250;
        const spacingY = 120;
        let battleCompletedCount = parseInt(
          localStorage.getItem("battle_completed_count") || "0",
        );
        const mapContainer = document.querySelector(".div");
        let renderedCoinCount = 0;

        const generateCoins = (startIndex, amount) => {
          if (!mapContainer) return;
          for (let i = 0; i < amount; i++) {
            const step = startIndex + i;
            const top = startY + step * spacingY;
            const left = xPattern[step % xPattern.length];

            const img = document.createElement("img");
            img.className = `coin-step coin-step-${step}`;
            img.style.position = "absolute";
            img.style.top = `${top}px`;
            img.style.left = `${left}px`;
            img.alt = "코인";

            // 배틀 완료 여부에 따른 색상 적용 (과거 단계는 노란코인, 미래 단계는 회색코인)
            if (battleCompletedCount > step) {
              img.src = "assets/coin_battle.svg";
            } else {
              img.src = "assets/gray_battle_coin.svg";
            }

            mapContainer.appendChild(img);
          }
          renderedCoinCount += amount;
          mapContainer.style.height = `${startY + renderedCoinCount * spacingY + 300}px`;
        };

        // 초기 동전 40개 미리 생성
        generateCoins(0, 40);

        // 스크롤 시 동전 무한 추가 생성 (무한 스크롤)
        const forestMapContainer = document.querySelector(
          ".forest-map-container",
        );
        if (forestMapContainer) {
          forestMapContainer.addEventListener("scroll", () => {
            const scrollTop = forestMapContainer.scrollTop;
            const clientHeight = forestMapContainer.clientHeight;
            const scrollHeight = forestMapContainer.scrollHeight;
            if (scrollTop + clientHeight > scrollHeight - 300) {
              generateCoins(renderedCoinCount, 20);
            }
          });
        }

        // 다람쥐 위치 및 수평반전 갱신
        const squirrel = document.querySelector(".object-icon");
        const studyBubble = document.getElementById("studyBubble");

        // battle 모드용 즉시 반영 함수
        const refreshBattleCoins = () => {
          battleCompletedCount = parseInt(
            localStorage.getItem("battle_completed_count") || "0",
          );
          const coinEls = document.querySelectorAll("img.coin-step");
          coinEls.forEach((el) => {
            const cls = Array.from(el.classList).find((c) =>
              c.startsWith("coin-step-"),
            );
            if (!cls) return;
            const step = parseInt(cls.split("-")[2], 10);
            el.src =
              battleCompletedCount > step
                ? "assets/coin_battle.svg"
                : "assets/gray_battle_coin.svg";
          });
          updateMascotPosition();
          updateBubblePosition();
        };

        // 다른 탭에서 변경 감지
        window.addEventListener("storage", (e) => {
          if (e.key === "battle_completed_count") refreshBattleCoins();
        });
        try {
          const bcBattle = new BroadcastChannel("battle_channel");
          bcBattle.addEventListener("message", (ev) => {
            if (ev.data === "battle_updated") refreshBattleCoins();
          });
        } catch (err) {
          console.debug("BroadcastChannel(battle) unavailable", err);
        }

        const updateMascotPosition = () => {
          const activeIndex =
            battleCompletedCount > 0 ? battleCompletedCount - 1 : 0;
          const activeCoinEl = document.querySelector(
            `.coin-step-${activeIndex}`,
          );

          if (squirrel && activeCoinEl) {
            const coinTop = parseFloat(activeCoinEl.style.top);
            const coinLeft = parseFloat(activeCoinEl.style.left);

            // 다람쥐가 코인 위에 앉아있도록 배치
            const squirrelTop = coinTop - 45;
            squirrel.style.top = `${squirrelTop}px`;
            squirrel.style.left = `${coinLeft + 1}px`;

            // 코인길의 위치에 왼쪽이면 다람쥐가 수평반전
            if (coinLeft < 150) {
              squirrel.style.transform = "scaleX(-1)";
            } else {
              squirrel.style.transform = "scaleX(1)";
            }

            // 다람쥐를 화면 수직 중앙에 맞추어 스크롤 (정밀한 수학적 계산)
            setTimeout(() => {
              if (forestMapContainer) {
                const containerHeight = forestMapContainer.clientHeight;
                const squirrelHeight = 90;
                const targetScrollTop =
                  squirrelTop - containerHeight / 2 + squirrelHeight / 2;

                forestMapContainer.scrollTo({
                  top: Math.max(0, targetScrollTop),
                  behavior: "smooth",
                });
              }
            }, 100);
          }
        };

        const updateBubblePosition = () => {
          if (squirrel && studyBubble) {
            const sqTop = parseFloat(squirrel.style.top);
            const sqLeft = parseFloat(squirrel.style.left);
            const sqWidth =
              parseFloat(window.getComputedStyle(squirrel).width) || 75;
            const sqHeight =
              parseFloat(window.getComputedStyle(squirrel).height) || 90;

            // 다람쥐 아래에 말풍선 위치 (top: Y + height + 8px)
            studyBubble.style.top = `${sqTop + sqHeight + 8}px`;

            requestAnimationFrame(() => {
              const containerWidth = forestMapContainer
                ? forestMapContainer.clientWidth
                : 390;
              const bubbleWidth = 177;
              const tailWidth = 26.4;

              // 다람쥐의 중앙 X 좌표
              const mascotCenter = sqLeft + sqWidth / 2;

              // 꼬리의 원래 위치(Figma 사양)를 보정한 말풍선의 이상적인 left 좌표
              const idealTailCenter = 17.41 + tailWidth / 2; // 30.61px
              const idealBubbleLeft = mascotCenter - idealTailCenter;

              // 화면(컨테이너)을 넘지 않도록 말풍선 자체의 X 좌표 제한 (좌우 여백 10px씩)
              const clampedBubbleLeft = Math.max(
                10,
                Math.min(containerWidth - bubbleWidth - 10, idealBubbleLeft),
              );
              studyBubble.style.left = `${clampedBubbleLeft}px`;

              // 말풍선이 위치이동을 했으므로, 다람쥐를 계속 가리키도록 꼬리의 left 좌표 동적 계산
              let newTailLeft =
                mascotCenter - clampedBubbleLeft - tailWidth / 2;

              // 꼬리가 말풍선 카드 좌우 라운드 영역(15px) 바깥으로 튀어나가지 않도록 제한
              newTailLeft = Math.max(
                15,
                Math.min(bubbleWidth - 15 - tailWidth, newTailLeft),
              );

              const tailEl = studyBubble.querySelector(".bubble-tail");
              if (tailEl) {
                tailEl.style.left = `${newTailLeft}px`;
              }
            });
          }
        };

        // 초기 위치 설정
        updateMascotPosition();

        // 다람쥐 클릭 시 이미지 전환 및 말풍선 제어
        if (squirrel && studyBubble) {
          let isClicked = false;

          squirrel.addEventListener("click", (e) => {
            e.stopPropagation();
            isClicked = !isClicked;

            if (isClicked) {
              // 클릭 상태: 앞모습 이미지로 변경 및 말풍선 표시
              squirrel.src = "assets/mascot_click.png";
              squirrel.style.transform = "scaleX(1)"; // 정면 응시를 위해 대칭 해제
              studyBubble.style.display = "block";
              updateBubblePosition();
            } else {
              resetMascot();
            }
          });

          const resetMascot = () => {
            isClicked = false;
            squirrel.src = "assets/home_mascot.png";
            studyBubble.style.display = "none";
            // 기존 코인 위치 및 대칭 상태로 복원
            updateMascotPosition();
          };

          // 화면 다른 곳 클릭 시 복원
          document.addEventListener("click", (e) => {
            if (e.target !== squirrel && e.target !== studyBubble) {
              resetMascot();
            }
          });

          // 말풍선 클릭 시 배틀 모드 시작 페이지로 이동
          studyBubble.addEventListener("click", () => {
            window.location.href = "battlestart.html";
          });
        }

        // 오늘의 O/X 퀴즈 더미데이터 목록
        const oxQuizzes = [
          {
            question:
              "한은 총재 후보에 오른 신현송은 대표적인 ‘매파’ 성향으로 알려져 있다.",
            answer: "O",
          },
          {
            question:
              "기준금리가 인하되면 시중 은행의 대출 금리는 일반적으로 상승한다.",
            answer: "X",
          },
          {
            question: "인플레이션 시기에는 화폐의 구매력이 상승한다.",
            answer: "X",
          },
          {
            question:
              "지속가능경영을 위한 비재무적 요소인 ESG에서 E는 Environment(환경)를 의미한다.",
            answer: "O",
          },
          {
            question:
              "GDP는 한 나라 영토 안에서 일정 기간 동안 생산된 최종 생산물의 시장가치 합계다.",
            answer: "O",
          },
        ];

        // 매일 다른 문제 로드 (날짜 기반 인덱스 결정)
        const today = new Date();
        const dateKey = `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
        const quizIndex = today.getDate() % oxQuizzes.length;
        const selectedQuiz = oxQuizzes[quizIndex];

        // 퀴즈 문제 적용
        const questionEl = document.querySelector(
          ".quiz-expanded-content .quiz-question",
        );
        if (questionEl && selectedQuiz) {
          questionEl.textContent = selectedQuiz.question;
        }

        // 오늘 퀴즈 완료 여부 체크
        const quizCard = document.getElementById("quizCard");
        const isSolved = localStorage.getItem(`quiz_solved_${dateKey}`);
        if (isSolved === "true") {
          quizCard.classList.add("solved");
        }

        // 오늘의 퀴즈 카드 토글 제어
        const toggleButtons = document.querySelectorAll(".btn-toggle-quiz");
        toggleButtons.forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            quizCard.classList.toggle("expanded");
          });
        });

        // 모달 관련 요소
        const resultModal = document.getElementById("quizResultModal");
        const modalTitle = document.getElementById("modalTitle");
        const modalText = document.getElementById("modalText");
        const modalConfirmBtn = document.getElementById("modalConfirmBtn");

        // O, X 버튼 클릭 리스너 설정
        const btnO = quizCard.querySelector(
          ".quiz-expanded-content .frame-child",
        );
        const btnX = quizCard.querySelector(
          ".quiz-expanded-content .union-icon2",
        );

        const handleAnswer = (userAnswer) => {
          // 이미 오늘 퀴즈를 풀었다면
          if (localStorage.getItem(`quiz_solved_${dateKey}`) === "true") {
            modalTitle.textContent = "참여 완료";
            modalTitle.style.color = "#888888";
            modalText.innerHTML =
              "오늘의 퀴즈를 이미 완료하셨습니다. 내일 새로운 문제로 만나요!";
            resultModal.style.display = "flex";
            return;
          }

          if (userAnswer === selectedQuiz.answer) {
            // 정답 처리
            currentCoins += 10;
            localStorage.setItem("user_coins", currentCoins.toString());
            if (coinCountEl) {
              coinCountEl.textContent = currentCoins;
            }

            modalTitle.textContent = "정답입니다!";
            modalTitle.style.color = "#0a6e3c";
            modalText.innerHTML = `코인 <strong class="battle-modal-acorn">10</strong>개를 획득했습니다!`;
          } else {
            // 오답 처리
            modalTitle.textContent = "아쉽게도 틀렸습니다!";
            modalTitle.style.color = "#ff4d4d";
            modalText.innerHTML = `정답은 <strong>${selectedQuiz.answer}</strong>입니다.<br><span style="font-size: 14px; color: #666;">내일 다시 도전해 보세요!</span>`;
          }

          // 오늘 퀴즈 풀기 완료 상태 저장 및 UI 반영
          localStorage.setItem(`quiz_solved_${dateKey}`, "true");
          quizCard.classList.add("solved");
          resultModal.style.display = "flex";
        };

        if (btnO) {
          btnO.addEventListener("click", (e) => {
            e.stopPropagation();
            handleAnswer("O");
          });
        }
        if (btnX) {
          btnX.addEventListener("click", (e) => {
            e.stopPropagation();
            handleAnswer("X");
          });
        }

        // 모달 닫기 버튼
        if (modalConfirmBtn) {
          modalConfirmBtn.addEventListener("click", () => {
            resultModal.style.display = "none";
            quizCard.classList.remove("expanded"); // 모달 닫을 때 카드 접기
          });
        }

        // 토글 스위치 클릭 시 일반 홈화면으로 이동
        const toggleSwitch = document.querySelector(".group-group");
        if (toggleSwitch) {
          toggleSwitch.style.cursor = "pointer";
          toggleSwitch.addEventListener("click", () => {
            window.location.href = "home.html";
          });
        }
      });
    </script>
  </body>
</html>
