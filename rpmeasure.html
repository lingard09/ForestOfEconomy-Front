<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>경제의 숲 - RP 측정 중</title>
    <link rel="icon" type="image/png" href="assets/acorn.png" />
    <link rel="stylesheet" href="assets/main.css" />
    <link rel="stylesheet" href="assets/pages.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-page-wrapper levelmeasure-page">
      <div class="app-content-container">
        <div class="div">
          <div class="div2">
            <div class="div3"></div>
            <div class="div4">로고</div>
          </div>
          <div class="parent">
            <div class="div5">잠시만 기다려주세요</div>
            <div class="div6">결과를 토대로 RP를 측정하고 있어요</div>
          </div>
          <img
            class="child"
            src="assets/rp_measure.png"
            alt="RP 측정 마스코트"
          />
        </div>
      </div>
    </div>

    <script>
      // 2초 대기 후 결과 페이지로 이동하여 AI 분석 연출 효과 극대화
      setTimeout(() => {
        // 레벨과 티어는 서로 독립된 개념이므로, 레벨 측정 결과로는 순수 레벨 소개 페이지로만 이동합니다.
        const level = localStorage.getItem("user-level") || "beginner";
        window.location.href = level + ".html";
      }, 2000);
    </script>
  </body>
