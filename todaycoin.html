<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>경제의 숲 - 도토리 획득</title>
    <link rel="icon" type="image/png" href="assets/acorn.png" />
    <link rel="stylesheet" href="assets/main.css" />
    <link rel="stylesheet" href="assets/pages.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Yde+street:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 컨테이너 패딩 제거 */
      .todaycoin-page .app-content-container {
        padding: 0 !important;
      }

      .todaycoin-page .div {
        width: 100%;
        min-height: 100vh;
        background-color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 32px;
        box-sizing: border-box;
      }

      .todaycoin-page .object-parent {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 25px;
        margin-top: auto;
        margin-bottom: auto;
      }

      .todaycoin-page .object-icon {
        width: 150px;
        height: 150px;
        object-fit: contain;
      }

      .todaycoin-page .div2 {
        font-size: 24px;
        font-weight: 700;
        color: #000;
        font-family: "Yde street", sans-serif;
      }

      .todaycoin-page .wrapper {
        width: 100%;
        display: flex;
        flex-direction: column;
        margin-top: auto;
        margin-bottom: 40px;
      }

      .todaycoin-page .div3 {
        align-self: stretch;
        height: 50px;
        border-radius: 40px;
        background-color: #0a6e3c;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      .todaycoin-page .div3:hover {
        opacity: 0.9;
      }

      .todaycoin-page .div4 {
        color: #fff;
        font-size: 16px;
        font-weight: 500;
        font-family: "Noto Sans KR", sans-serif;
      }

      @media (min-width: 768px) {
        .todaycoin-page .div {
          min-height: 844px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-page-wrapper todaycoin-page">
      <div class="app-content-container">
        <div class="div">
          <div class="object-parent">
            <img
              class="object-icon"
              alt="도토리"
              src="assets/coin_reward_mascot.png"
            />
            <div class="div2">0 코인 획득!</div>
          </div>
          <div class="wrapper btn-confirm">
            <div class="div3">
              <div class="div4">확인하기</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // 정답 수 계산 및 코인 개수 반영
      const correctCount = parseInt(
        sessionStorage.getItem("correct_count") || "0",
      );
      let coins = 0;
      if (correctCount === 3) {
        coins = 100;
      } else if (correctCount === 2) {
        coins = 66;
      } else if (correctCount === 1) {
        coins = 33;
      }

      const coinsText = document.querySelector(".div2");
      if (coinsText) {
        coinsText.textContent = `${coins} 코인 획득!`;
      }

      const confirmBtn = document.querySelector(".btn-confirm");
      if (confirmBtn) {
        confirmBtn.addEventListener("click", () => {
          // 획득 코인을 user_coins에 누적 저장
          const savedCoins = parseInt(localStorage.getItem("user_coins") || "0");
          localStorage.setItem("user_coins", (savedCoins + coins).toString());
          window.location.href = "todaylevelup.html";
        });
      }
    </script>
  </body>
</html>
