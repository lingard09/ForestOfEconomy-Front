<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>경제의 숲 - 뉴스 목록</title>
    <link rel="icon" type="image/png" href="assets/acorn.png" />
    <link rel="stylesheet" href="assets/main.css" />
    <link rel="stylesheet" href="assets/pages.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Yde+street:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 컨테이너 패딩 제거 */
      .newslist-page .app-content-container {
        padding: 0 !important;
      }

      .newslist-page .div {
        width: 100%;
        height: 100%;
        background-color: #fff;
        display: flex;
        flex-direction: column;
        padding: 0 32px;
        box-sizing: border-box;
        position: relative;
      }

      /* 타이틀 */
      .newslist-page .div26 {
        font-size: 24px;
        font-weight: 700;
        font-family: "Yde street", sans-serif;
        color: #000;
        margin-top: 50px;
        margin-bottom: 25px;
      }

      /* 뉴스 목록 컨테이너 (스크롤 가능) */
      .newslist-page .frame-parent {
        display: flex;
        flex-direction: column;
        gap: 25px;
        flex: 1;
        overflow-y: auto;
        margin-bottom: 110px; /* 네비바 공간 확보 */
        padding-right: 4px;
      }

      /* 스크롤바 숨기기 */
      .newslist-page .frame-parent::-webkit-scrollbar {
        width: 4px;
      }
      .newslist-page .frame-parent::-webkit-scrollbar-thumb {
        background-color: #e0e0e0;
        border-radius: 2px;
      }

      .newslist-page .frame-group {
        display: flex;
        flex-direction: column;
        gap: 15px;
        cursor: pointer;
      }

      .newslist-page .frame-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .newslist-page .frame-div {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }

      .newslist-page .parent {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .newslist-page .div2 {
        font-size: 15px;
        font-weight: 700;
        color: #000;
        text-align: left;
        line-height: 1.4;
      }

      .newslist-page .div3 {
        font-size: 11px;
        color: #999;
        white-space: nowrap;
      }

      .newslist-page .div4 {
        font-size: 13px;
        color: #666;
        text-align: left;
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .newslist-page .frame-child {
        width: 66.5px;
        height: 66.5px;
        border-radius: 8px;
        object-fit: cover;
        flex-shrink: 0;
        background-color: #d9d9d9;
      }

      .newslist-page .div5 {
        height: 1px;
        background-color: #eee;
        width: 100%;
      }

      /* 하단 네비게이션 바 외부 컨테이너 */
      .newslist-page .div27 {
        position: absolute;
        bottom: 40px;
        left: calc(50% - 162.5px);
        width: 325px;
        height: 50px;
        border-radius: 40px;
        background-color: #131313;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div class="app-page-wrapper newslist-page">
      <div class="app-content-container">
        <div class="div">
          <div class="div26">뉴스</div>

          <!-- 뉴스 목록 영역 -->
          <div class="frame-parent" id="newsListContainer">
            <!-- 뉴스 아이템들이 자바스크립트로 동적 렌더링됩니다. -->
          </div>

          <!-- 하단 공통 네비게이션 바 컨테이너 -->
        </div>
        <div class="div27"></div>
      </div>
    </div>

    <!-- 데이터 및 네비바 스크립트 로드 -->
    <script src="assets/newsdata.js"></script>
    <script src="assets/navbar.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // 뉴스 탭 활성화 상태로 렌더링
        renderNavbar("news");

        // 뉴스 목록 동적 생성
        const container = document.getElementById("newsListContainer");
        if (container && typeof newsData !== "undefined") {
          container.innerHTML = Object.values(newsData).map(news => `
            <div class="frame-group btn-news-item" data-id="${news.id}">
              <div class="frame-container">
                <div class="frame-div">
                  <div class="parent">
                    <div class="div2">${news.title}</div>
                    <div class="div3">${news.date}</div>
                  </div>
                  <div class="div4">${news.summary}</div>
                </div>
                <img class="frame-child" src="${news.image}" alt="뉴스 이미지" />
              </div>
              <div class="div5"></div>
            </div>
          `).join("");
        }

        // 각 뉴스 아이템 클릭 시 뉴스 상세 페이지로 연결
        const newsItems = document.querySelectorAll(".btn-news-item");
        newsItems.forEach((item) => {
          item.addEventListener("click", () => {
            const id = item.getAttribute("data-id");
            window.location.href = `newsdetail.html?id=${id}`;
          });
        });
      });
    </script>
  </body>
</html>
