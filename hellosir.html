<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경제의 숲 - 반갑습니다</title>
  <link rel="stylesheet" href="assets/main.css">
  <link rel="stylesheet" href="assets/pages.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-page-wrapper hellosir-page">
    <div class="app-content-container" style="min-height: 844px; overflow: hidden; border-radius: 20px;">
      <!-- 상단 헤더 영역 (코인 + 웰컴텍스트) -->
      <div class="parent-section">
        <img class="coin-icon" src="assets/coin.png" alt="도토리 코인" />
        <div class="welcome-text-wrapper">
          <div class="welcome-text global-font-noto">
            <span>반가워요<br /></span>
            <span class="user-nickname">사용자</span>
            <span>님!</span>
          </div>
        </div>
      </div>

      <!-- 중앙 다람쥐 캐릭터 -->
      <div class="mascot-wrapper">
        <img class="mascot-character" src="assets/mascot.png" alt="다람쥐 마스코트" />
      </div>
    </div>
  </div>

  <script>
    // 닉네임 로드
    const nickname = localStorage.getItem('user-nickname') || '사용자';
    document.querySelector('.user-nickname').textContent = nickname;

    // 3초 뒤에 레벨선택안내(/leveloption) 화면으로 자동 이동
    setTimeout(() => {
      window.location.href = 'leveloption.html';
    }, 3000);
  </script>
</body>
</html>
