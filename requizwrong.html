<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>경제의 숲 - 오늘의 퀴즈</title>
    <link rel="icon" type="image/png" href="assets/acorn.png" />
    <link rel="stylesheet" href="assets/main.css" />
    <link rel="stylesheet" href="assets/pages.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 컨테이너 패딩 제거 */
      .todayquiz-page .app-content-container {
        padding: 0 !important;
      }

      .todayquiz-page .div {
        width: 100%;
        min-height: 100vh;
        background-color: #fff;
        display: flex;
        flex-direction: column;
        text-align: center;
        font-size: 14px;
        color: #000;
        font-family: "Noto Sans KR";
        padding: 0 32px;
        box-sizing: border-box;
      }

      /* 뒤로가기 화살표 */
      .todayquiz-page .child {
        width: 31.9px;
        height: 14.6px;
        object-fit: contain;
        opacity: 0.3;
        cursor: pointer;
        align-self: flex-start;
        margin-top: 40px;
      }

      /* 진행바 */
      .todayquiz-page .rectangle-parent {
        align-self: stretch;
        height: 10px;
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 20px;
      }
      .todayquiz-page .frame-child {
        height: 3px;
        width: 28px;
        border-radius: 2px;
        background-color: #0a6e3c;
      }
      .todayquiz-page .frame-item {
        height: 3px;
        width: 28px;
        border-radius: 2px;
        background-color: #f6f6f6;
      }

      /* 도토리 아이콘 + 질문 영역 */
      .todayquiz-page .frame-group {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 25px;
        width: 100%;
        margin-top: 35px;
        color: #787878;
      }
      .todayquiz-page .group-parent {
        align-self: stretch;
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .todayquiz-page .group-icon {
        height: 32.2px;
        width: 30px;
        object-fit: contain;
      }
      .todayquiz-page .div2 {
        font-weight: 500;
      }
      .todayquiz-page .div7 {
        align-self: stretch;
        font-size: 16px;
        font-weight: 500;
        color: #000;
        text-align: left;
      }

      /* 보기 선택지 */
      .todayquiz-page .instance-parent {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        width: 100%;
        font-size: 16px;
        margin-top: 40px;
        flex: 1;
      }

      /* 미선택 보기 */
      .todayquiz-page .ellipse-parent {
        align-self: stretch;
        height: 60px;
        border-radius: 40px;
        background-color: #f6f6f6;
        border: 1px solid #f6f6f6;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        padding: 5px 20px 5px 6px;
        gap: 16px;
      }
      .todayquiz-page .instance-child {
        height: 50px;
        width: 50px;
        border-radius: 50%;
        background-color: #fff;
        flex-shrink: 0;
      }

      /* 정답인 보기 (초록색 배경) */
      .todayquiz-page .ellipse-parent.correct-option {
        background-color: #0a6e3c;
        border-color: #0a6e3c;
      }
      .todayquiz-page .ellipse-parent.correct-option .div2 {
        color: #fff;
      }

      /* 오답인 보기 (검은색 배경) */
      .todayquiz-page .ellipse-parent.wrong-option {
        background-color: #272727;
      }
      .todayquiz-page .ellipse-parent.wrong-option .div2 {
        color: #fff;
      }

      .todayquiz-page .vector-wrapper {
        height: 50px;
        width: 50px;
        border-radius: 50%;
        background-color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      /* 아이콘 크기 */
      .todayquiz-page .circle-outline-icon,
      .todayquiz-page .x-icon {
        width: 20px;
        height: 20px;
      }

      /* 하단 버튼 */
      .todayquiz-page .wrapper {
        border-radius: 30px;
        background-color: #272727;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 17px 60px;
        color: #fff;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
        align-self: center;
        margin-top: auto;
        margin-bottom: 40px;
        z-index: 10;
      }
      .todayquiz-page .wrapper:hover {
        opacity: 0.9;
      }

      /* 모달 스타일 */
      .todayquiz-page .item {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        background-color: rgba(0, 0, 0, 0.4);
        width: 100%;
        height: 100%;
        z-index: 100;
        display: none;
      }
      .todayquiz-page .rectangle-group {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        height: 420px;
        z-index: 101;
        text-align: left;
        color: #000;
        display: none;
      }
      .todayquiz-page .group-child {
        position: absolute;
        top: 0;
        left: 0;
        box-shadow: 0px -10px 30px rgba(0, 0, 0, 0.05);
        border-radius: 30px 30px 0px 0px;
        background-color: #fff;
        width: 100%;
        height: 420px;
      }
      .todayquiz-page .div9 {
        position: absolute;
        top: 40px;
        left: calc(50% - 40px);
        font-size: 18px;
        font-weight: 500;
      }
      .todayquiz-page .div10 {
        position: absolute;
        top: 95px;
        left: 32px;
        width: calc(100% - 64px);
        height: 210px;
        font-size: 16px;
        line-height: 1.6;
        color: #000;
      }
      .todayquiz-page .container {
        position: absolute;
        top: 316.37px;
        left: calc(50% - 105px);
        border-radius: 30px;
        background-color: #272727;
        width: 210px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 500;
        cursor: pointer;
        padding: 17px 50px;
        box-sizing: border-box;
      }
      .todayquiz-page .div8 {
        position: relative;
        font-weight: 500;
        flex-shrink: 0;
      }
      .todayquiz-page .parent {
        position: absolute;
        top: 35px;
        right: 32px;
        width: 15px;
        height: 15px;
        cursor: pointer;
      }
      .todayquiz-page .div12 {
        position: absolute;
        top: 1.5px;
        left: 0px;
        background-color: #272727;
        width: 2.1px;
        height: 19.1px;
        transform: rotate(-45deg);
        transform-origin: 0 0;
      }
      .todayquiz-page .div13 {
        position: absolute;
        top: 0px;
        left: 13.5px;
        background-color: #272727;
        width: 2.1px;
        height: 19.1px;
        transform: rotate(45deg);
        transform-origin: 0 0;
      }

      @media (min-width: 768px) {
        .todayquiz-page .div {
          min-height: 844px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-page-wrapper todayquiz-page">
      <div class="app-content-container">
        <div class="div">
          <img
            class="child btn-back"
            src="assets/arrow_back.png"
            alt="뒤로가기"
          />

          <div class="rectangle-parent">
            <div class="frame-child"></div>
            <div class="frame-item"></div>
            <div class="frame-item"></div>
            <div class="frame-item"></div>
            <div class="frame-item"></div>
            <div class="frame-item"></div>
            <div class="frame-item"></div>
            <div class="frame-item"></div>
            <div class="frame-item"></div>
            <div class="frame-item"></div>
          </div>

          <div class="frame-group">
            <div class="group-parent">
              <img class="group-icon" alt="도토리" src="assets/acorn.png" />
              <div class="div2">문제의 정답은?</div>
            </div>
            <div class="div7">
              이란의 최고 지도자인 하메네이가 미군의 폭격으로 사망한 이후, 다음
              지도자로 선출된 사람은?
            </div>
          </div>

          <div class="instance-parent">
            <!-- 1번: 정답 (초록색 배경 + 동그라미 아웃라인 아이콘) -->
            <div class="ellipse-parent correct-option" data-index="1">
              <div class="vector-wrapper">
                <svg
                  class="circle-outline-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#0a6e3c"
                  stroke-width="3"
                >
                  <circle cx="12" cy="12" r="9" />
                </svg>
              </div>
              <div class="div2">모즈타파</div>
            </div>
            <!-- 2번: 미선택 -->
            <div class="ellipse-parent" data-index="2">
              <div class="instance-child"></div>
              <div class="div2">전공타파</div>
            </div>
            <!-- 3번: 미선택 -->
            <div class="ellipse-parent" data-index="3">
              <div class="instance-child"></div>
              <div class="div2">소나타파</div>
            </div>
            <!-- 4번: 오답 (검은색 배경 + X 아이콘) -->
            <div class="ellipse-parent wrong-option" data-index="4">
              <div class="vector-wrapper">
                <svg
                  class="x-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#272727"
                  stroke-width="3.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <line x1="18" y1="6" x2="6" y2="18" />
                  <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
              </div>
              <div class="div2">무스탕파</div>
            </div>
          </div>

          <div class="wrapper btn-next">
            <div class="div2">오답 해설</div>
          </div>

          <!-- 오답 해설 모달 -->
          <div class="item"></div>
          <div class="rectangle-group">
            <div class="group-child"></div>
            <div class="div9">오답 해설</div>
            <div class="div10">
              <span
                >이란의 최고 지도자인 하메네이가 미군의 폭격으로 사망한 이후,
                다음 지도자로 선출된 사람은 ‘</span
              >
              <b>모즈타파</b>
              <span>’ 입니다.</span>
            </div>
            <div class="container btn-save-note">
              <div class="div8">확인</div>
            </div>
            <div class="parent btn-close-modal">
              <div class="div12"></div>
              <div class="div13"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const quizData = {
        "1": {
          question: "이란의 최고 지도자인 하메네이가 미군의 폭격으로 사망한 이후, 다음 지도자로 선출된 사람은?",
          options: ["모즈타파", "전공타파", "소나타파", "무스탕파"],
          correctIndex: 1,
          explanation: "이란의 최고 지도자인 하메네이가 미군의 폭격으로 사망한 이후, 다음 지도자로 선출된 사람은 ‘모즈타파’ 입니다.",
          progress: 3
        },
        "2": {
          question: "최근 연방준비제도(Fed)가 물가 안정을 위해 기준금리를 한 번에 0.5%p 인상하는 조치를 무엇이라 부를까요?",
          options: ["베이비 스텝", "빅스텝", "자이언트 스텝", "울트라 스텝"],
          correctIndex: 2,
          explanation: "기준금리를 한 번에 0.5%포인트 인상하는 조치는 ‘빅스텝’ 입니다.",
          progress: 6
        },
        "3": {
          question: "기업의 비재무적 요소인 환경, 사회, 지배구조를 뜻하며, 투자 의사 결정 시 지속가능성을 평가하는 지표는 무엇일까요?",
          options: ["ESG", "FTA", "RCEP", "IMF"],
          correctIndex: 1,
          explanation: "기업의 환경, 사회, 지배구조 등 비재무적 요소를 평가하는 지표는 ‘ESG’ 입니다.",
          progress: 10
        }
      };

      const currentRound = sessionStorage.getItem("quiz_round") || "1";
      const currentData = quizData[currentRound] || quizData["1"];
      const chosenAnswer = parseInt(sessionStorage.getItem("chosen_answer") || (currentData.correctIndex === 1 ? "4" : "1"));

      // 질문 변경
      document.querySelector(".div7").textContent = currentData.question;

      // 모달 오답 해설 설명 문구 변경
      document.querySelector(".div10").innerHTML = `
        <span>${currentData.explanation.split("‘")[0]}‘</span>
        <b>${currentData.explanation.split("‘")[1].split("’")[0]}</b>
        <span>’${currentData.explanation.split("’")[1]}</span>
      `;

      // 보기 변경 및 정답/오답 하이라이트
      const options = document.querySelectorAll(".ellipse-parent[data-index]");
      options.forEach((el) => {
        const index = parseInt(el.getAttribute("data-index"));
        const textDiv = el.querySelector(".div2");
        if (textDiv && currentData.options[index - 1]) {
          textDiv.textContent = currentData.options[index - 1];
        }

        // 초기 클래스 제거
        el.className = "ellipse-parent";

        if (index === currentData.correctIndex) {
          el.classList.add("correct-option");
          // 초록색 원형 아이콘 구조
          el.innerHTML = `
            <div class="vector-wrapper">
              <svg class="circle-outline-icon" viewBox="0 0 24 24" fill="none" stroke="#0a6e3c" stroke-width="3">
                <circle cx="12" cy="12" r="9" />
              </svg>
            </div>
            <div class="div2">${currentData.options[index - 1]}</div>
          `;
        } else if (index === chosenAnswer) {
          el.classList.add("wrong-option");
          // 검은색 X 아이콘 구조
          el.innerHTML = `
            <div class="vector-wrapper">
              <svg class="x-icon" viewBox="0 0 24 24" fill="none" stroke="#272727" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </div>
            <div class="div2">${currentData.options[index - 1]}</div>
          `;
        } else {
          el.innerHTML = `
            <div class="instance-child"></div>
            <div class="div2">${currentData.options[index - 1]}</div>
          `;
        }
      });

      // 진행바 변경
      const progressBars = document.querySelectorAll(".rectangle-parent > div");
      progressBars.forEach((bar, idx) => {
        if (idx < currentData.progress) {
          bar.className = "frame-child";
        } else {
          bar.className = "frame-item";
        }
      });

      const backBtn = document.querySelector(".btn-back");
      const nextBtn = document.querySelector(".btn-next");
      const modalOverlay = document.querySelector(".item");
      const modalSheet = document.querySelector(".rectangle-group");
      const closeModalBtn = document.querySelector(".btn-close-modal");
      const saveNoteBtn = document.querySelector(".btn-save-note");
      const btnNextText = nextBtn.querySelector(".div2");

      if (backBtn) {
        backBtn.addEventListener("click", () => {
          window.history.back();
        });
      }

      if (nextBtn) {
        nextBtn.addEventListener("click", () => {
          if (btnNextText.textContent.trim() === "오답 해설") {
            // 모달 열기
            modalOverlay.style.display = "block";
            modalSheet.style.display = "block";
          } else {
            // 다음 라운드로 이동 또는 오늘의 학습 완료
            const currentRoundNum = parseInt(currentRound);
            if (currentRoundNum < 3) {
              sessionStorage.setItem("quiz_round", (currentRoundNum + 1).toString());
              window.location.href = 'todayquiz.html';
            } else {
              window.location.href = 'todaydone.html';
            }
          }
        });
      }

      // 모달 닫기 함수
      const closeModal = () => {
        modalOverlay.style.display = "none";
        modalSheet.style.display = "none";
      };

      if (closeModalBtn) {
        closeModalBtn.addEventListener("click", closeModal);
      }
      if (modalOverlay) {
        modalOverlay.addEventListener("click", closeModal);
      }

      if (saveNoteBtn) {
        saveNoteBtn.addEventListener("click", () => {
          closeModal();
          // 버튼 텍스트 변경
          if (btnNextText) {
            btnNextText.textContent = "다음";
          }
        });
      }
    </script>
  </body>
</html>
