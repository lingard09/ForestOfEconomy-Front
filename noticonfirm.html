<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경제의 숲 - 알림 설정 완료</title>
  <link rel="icon" type="image/png" href="assets/acorn.png">
  <link rel="stylesheet" href="assets/main.css">
  <link rel="stylesheet" href="assets/pages.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-page-wrapper noticonfirm-page">
    <div class="app-content-container">
      <!-- 상단 알림 확인 마스코트 일러스트 -->
      <div class="mascot-wrapper">
        <img class="mascot-confirm-image" src="assets/noti_confirm.png" alt="알림 설정 완료" />
      </div>

      <!-- 안내 문구 영역 -->
      <div class="message-section">
        <h1 class="confirm-title global-font-yde">알겠어요!</h1>
        <p class="confirm-subtitle global-font-noto">
          매일 <span class="time-text-display">아침 8시</span>에 알림을 드릴게요<br />
          알림은 나중에 설정에서 변경할 수 있어요
        </p>
      </div>

      <!-- 하단 시작하기 버튼 -->
      <div class="button-wrapper">
        <button class="btn-primary-green btn-start" style="cursor: pointer;">시작하기</button>
      </div>
    </div>
  </div>

  <script>
    const notiTime = localStorage.getItem('noti-time') || 'morning';

    function formatTimeText(time) {
      switch (time) {
        case 'morning':
          return '아침 8시';
        case 'lunch':
          return '낮 1시';
        case 'evening':
          return '저녁 8시';
        case 'night':
          return '취침 전 11시';
        default:
          return '아침 8시';
      }
    }

    document.querySelector('.time-text-display').textContent = formatTimeText(notiTime);

    document.querySelector('.btn-start').addEventListener('click', () => {
      localStorage.setItem('onboarding-completed', 'true');
      // 시작하기 누르면 메인 오늘의 학습 대시보드 화면(today.html)으로 이동합니다.
      window.location.href = 'today.html';
    });
  </script>
</body>
</html>
