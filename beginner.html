<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경제의 숲 - 새싹 다람쥐</title>
  <link rel="icon" type="image/png" href="assets/acorn.png">
  <link rel="stylesheet" href="assets/main.css">
  <link rel="stylesheet" href="assets/pages.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-page-wrapper beginner-page">
    <div class="app-content-container">
      <div class="div">
        <div class="div2">
          <div class="div3"></div>
          <div class="div4">로고</div>
        </div>
        
        <div class="child"></div>
        <div class="item"></div>
        
        <div class="frame-parent">
          <div class="frame-group">
            <div class="wrapper">
              <div class="div5">BEGINNER</div>
            </div>
            <div class="div6 user-level-display">200 Lv</div>
          </div>
          <div class="div7">새싹 다람쥐는 이제 막 모험을<br>시작한 초보 다람쥐예요!<br>기본기를 배우고  차근차근 성장해요</div>
        </div>
        
        <img class="object-icon" src="assets/squirrel_beginner.png" alt="새싹 다람쥐" />
        <img class="object-icon2" src="assets/badge_beginner.png" alt="초보 훈장" />
        
        <div class="container">
          <div class="div8 btn-confirm" style="cursor: pointer;">
            <div class="div9">확인하기</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 세부 점수 로드 및 바인딩
    const levelScore = localStorage.getItem('user-level-score') || '200';
    document.querySelector('.user-level-display').textContent = levelScore + ' Lv';

    document.querySelector('.btn-confirm').addEventListener('click', () => {
      window.location.href = 'notisuggest.html';
    });
  </script>
</body>
</html>
