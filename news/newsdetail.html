<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>경제의 숲 - 뉴스 상세</title>
    <link rel="icon" type="image/png" href="../assets/acorn.png" />
    <link rel="stylesheet" href="../assets/main.css" />
    <link rel="stylesheet" href="../assets/pages.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Yde+street:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 컨테이너 패딩 제거 */
      .newsdetail-page .app-content-container {
        padding: 0 !important;
      }

      .newsdetail-page .div {
        width: 100%;
        height: 100%;
        background-color: #fff;
        display: flex;
        flex-direction: column;
        text-align: left;
        font-size: 14px;
        color: #000;
        font-family: "Noto Sans KR", sans-serif;
        padding: 0 32px;
        box-sizing: border-box;
        position: relative;
      }

      /* 뒤로가기 화살표 */
      .newsdetail-page .child {
        width: 31.9px;
        height: 14.6px;
        object-fit: contain;
        opacity: 0.3;
        cursor: pointer;
        align-self: flex-start;
        margin-top: 40px;
      }

      /* 뉴스 제목 */
      .newsdetail-page .div2 {
        font-size: 20px;
        font-weight: 700;
        width: 100%;
        margin-top: 30px;
        line-height: 1.4;
      }

      /* 날짜 */
      .newsdetail-page .date-row {
        display: flex;
        align-items: center;
        width: 100%;
        margin-top: 8px;
        font-size: 12px;
        color: #999;
      }

      /* 뉴스 이미지 */
      .newsdetail-page .icon {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 8px;
        margin-top: 20px;
      }

      /* 뉴스 본문 */
      .newsdetail-page #newsContent {
        font-size: 15px;
        width: 100%;
        margin-top: 20px;
        line-height: 1.7;
        color: #333;
        flex: 1;
        overflow-y: auto;
        margin-bottom: 110px; /* 네비바 공간 확보 */
      }

      /* 하단 네비게이션 바 외부 컨테이너 */
      .newsdetail-page .div27 {
        position: absolute;
        bottom: 40px;
        left: calc(50% - 162.5px);
        width: 325px;
        height: 50px;
        border-radius: 40px;
        background-color: #131313;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div class="app-page-wrapper newsdetail-page">
      <div class="app-content-container">
        <div class="div">
          <img class="child btn-back" src="../assets/arrow_back.png" alt="뒤로가기" />

          <div class="div2" id="newsTitle">로딩 중...</div>

          <div class="date-row">
            <div id="newsDate">6시간 전</div>
          </div>

          <img class="icon" id="newsImage" alt="뉴스 이미지" src="" />

          <div class="div4" id="newsContent">
            로딩 중...
          </div>

          <!-- 하단 공통 네비게이션 바 컨테이너 -->
        </div>
        <div class="div27"></div>
      </div>
    </div>

    <!-- 데이터 및 네비바 스크립트 로드 -->
    <script src="../assets/newsdata.js"></script>
    <script src="../assets/navbar.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // 뉴스 탭 활성화
        renderNavbar("news");

        // URL 파라미터에서 id 추출
        const params = new URLSearchParams(window.location.search);
        const newsId = params.get("id") || "1";
        const currentNews = newsData[newsId] || newsData["1"];

        // 상세 내용 렌더링
        document.getElementById("newsTitle").textContent = currentNews.title;
        document.getElementById("newsDate").textContent = currentNews.date;
        document.getElementById("newsImage").setAttribute("src", currentNews.image);
        document.getElementById("newsContent").textContent = currentNews.content;

        // 뒤로가기 버튼 클릭 이벤트
        const backBtn = document.querySelector(".btn-back");
        if (backBtn) {
          backBtn.addEventListener("click", () => {
            window.location.href = 'newslist.html';
          });
        }
      });
    </script>
  </body>
</html>
