<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경제의 숲 - 객관식 문제</title>
  <link rel="icon" type="image/png" href="assets/acorn.png">
  <link rel="stylesheet" href="assets/main.css">
  <link rel="stylesheet" href="assets/pages.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-page-wrapper problem-multiple-page">
    <div class="app-content-container" style="padding: 0; min-height: 844px; overflow: hidden; border-radius: 20px;">
      <div class="div">
        <img class="child btn-back" src="assets/arrow_back.png" alt="뒤로가기" style="cursor: pointer;" />
        
        <div class="rectangle-parent">
          <div class="frame-child"></div>
          <div class="frame-item"></div>
          <div class="frame-item"></div>
          <div class="frame-item"></div>
          <div class="frame-item"></div>
          <div class="frame-item"></div>
          <div class="frame-item"></div>
          <div class="frame-item"></div>
          <div class="frame-item"></div>
          <div class="frame-item"></div>
        </div>
        
        <div class="instance-parent">
          <div class="ellipse-parent option-item" data-index="1" style="cursor: pointer;">
            <div class="instance-child check-circle">
              <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="#0a6e3c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </div>
            <div class="div2">모즈타파</div>
          </div>
          
          <div class="ellipse-parent option-item" data-index="2" style="cursor: pointer;">
            <div class="instance-child check-circle">
              <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="#0a6e3c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </div>
            <div class="div2">전공타파</div>
          </div>
          
          <div class="ellipse-parent option-item" data-index="3" style="cursor: pointer;">
            <div class="instance-child check-circle">
              <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="#0a6e3c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </div>
            <div class="div2">소나타파</div>
          </div>
          
          <div class="ellipse-parent option-item" data-index="4" style="cursor: pointer;">
            <div class="instance-child check-circle">
              <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="#0a6e3c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </div>
            <div class="div2">무스탕파</div>
          </div>
        </div>
        
        <div class="frame-group">
          <div class="group-wrapper">
            <img class="group-icon" src="assets/acorn.png" alt="도토리" />
          </div>
          <div class="div6">이란의 최고 지도자인 하메네이가 미군의 폭격으로 사망한 이후, 다음 지도자로 선출된 사람은?</div>
        </div>
        
        <div class="wrapper btn-next" style="cursor: pointer;">
          <div class="div2">다음</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const options = document.querySelectorAll('.option-item');
    const nextBtn = document.querySelector('.btn-next');
    const backBtn = document.querySelector('.btn-back');
    let selectedOption = null;

    options.forEach((option) => {
      option.addEventListener('click', () => {
        options.forEach((opt) => {
          opt.classList.remove('is-active');
        });
        option.classList.add('is-active');
        selectedOption = parseInt(option.dataset.index);
      });
    });

    if (backBtn) {
      backBtn.addEventListener('click', () => {
        window.history.back();
      });
    }

    if (nextBtn) {
      nextBtn.addEventListener('click', () => {
        if (selectedOption) {
          console.log('선택된 정답 인덱스:', selectedOption);
          window.location.href = 'today.html';
        }
      });
    }
  </script>
</body>
</html>
