<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>경제의 숲 - 골드 V</title>
    <link rel="icon" type="image/png" href="../../assets/acorn.png" />
    <link rel="stylesheet" href="../../assets/main.css" />
    <link rel="stylesheet" href="../../assets/pages.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Yde+street:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-page-wrapper bronze-page">
      <div class="app-content-container">
        <div class="div">
          <div class="div2">
            <div class="div3"></div>
            <div class="div4">로고</div>
          </div>

          <div class="wrapper btn-confirm">
            <div class="div5">
              <div class="div6">확인하기</div>
            </div>
          </div>

          <!-- SVG Progress Ring -->
          <div class="child">
            <svg class="progress-ring" viewBox="0 0 290 290" width="100%" height="100%">
              <g transform="rotate(-90 145 145)">
                <!-- 배경 링 -->
                <circle
                  class="progress-ring__background"
                  stroke="#D8DAE4"
                  stroke-width="16"
                  fill="transparent"
                  r="130"
                  cx="145"
                  cy="145"
                />
                <!-- 진행 링 -->
                <circle
                  class="progress-ring__bar"
                  stroke="#f2a500"
                  stroke-width="16"
                  stroke-linecap="round"
                  fill="transparent"
                  r="130"
                  cx="145"
                  cy="145"
                  stroke-dasharray="816.8"
                  stroke-dashoffset="816.8"
                />
              </g>
            </svg>
          </div>

          <div class="rp-wrapper" style="background-color: #f2a500;">
            <div class="rp">+20 RP!</div>
          </div>

          <img
            class="object-icon"
            src="../../assets/badge_gold.png"
            alt="골드 V 훈장"
          />

          <div class="parent">
            <div class="div7">골드 V</div>
            <div class="div8">1000/1200 RP</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // 확인하기 버튼 이벤트
        document.querySelector(".btn-confirm").addEventListener("click", () => {
          if (localStorage.getItem('onboarding-completed') === 'true') {
            window.location.href = '../../study/today.html';
          } else {
            window.location.href = '../../onboarding/notisuggest.html';
          }
        });

        // 사용자 레벨 스코어(RP)에 기반한 동적 원형 프로그레스 바 연동
        const userRp = parseInt(localStorage.getItem('user-rp') || '1000', 10);
        const maxRp = 1200;
        const currentRp = Math.min(userRp, maxRp); // 최대 1200 상한선
        
        document.querySelector('.div8').textContent = `${currentRp}/${maxRp} RP`;

        // SVG progress-ring 진행률 설정
        const circle = document.querySelector('.progress-ring__bar');
        const radius = circle.r.baseVal.value;
        const circumference = 2 * Math.PI * radius;
        
        circle.style.strokeDasharray = `${circumference} ${circumference}`;
        
        const progress = currentRp / maxRp;
        const offset = circumference - (progress * circumference);
        
        // 부드러운 애니메이션 출력을 위해 프레임 대기 후 offset 설정
        setTimeout(() => {
          circle.style.strokeDashoffset = offset;
        }, 100);
      });
    </script>
  </body>
</html>
